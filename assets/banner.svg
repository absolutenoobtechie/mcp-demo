<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.98" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#cyberGrid)" />

  <!-- Ambient Light -->
  <rect width="1200" height="320" fill="url(#cyanGlow)" />
  <rect width="1200" height="320" fill="url(#violetGlow)" />

  <!-- Subtle Top & Bottom Tech Border Lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#1e293b" stroke-width="1" />

  <!-- Decorative Circuit Traces -->
  <path d="M 0 80 L 120 80 L 150 110 L 260 110" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.3" />
  <circle cx="260" cy="110" r="3" fill="#00f2fe" opacity="0.6" />
  <path d="M 1200 240 L 1050 240 L 1020 210 L 900 210" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.3" />
  <circle cx="900" cy="210" r="3" fill="#8b5cf6" opacity="0.6" />

  <!-- Shield Emblem Group (Left side, centered vertically) -->
  <g transform="translate(100, 50)">
    <!-- Shield Outer Aura -->
    <path d="M 110 18 
             C 156 18, 187 35, 187 83 
             C 187 140, 140 178, 110 193 
             C 80 178, 33 140, 33 83 
             C 33 35, 64 18, 110 18 Z" 
          fill="none" 
          stroke="url(#shieldBorder)" 
          stroke-width="3" 
          filter="url(#neonGlow)" 
          opacity="0.5"/>

    <!-- Shield Body -->
    <path d="M 110 20 
             C 154 20, 185 37, 185 83 
             C 185 138, 138 175, 110 190 
             C 82 175, 35 138, 35 83 
             C 35 37, 66 20, 110 20 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#shieldBorder)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Terminal Window inside Shield -->
    <g transform="translate(58, 62)">
      <rect width="104" height="72" rx="7" fill="#030712" stroke="#1f2937" stroke-width="1.5" />
      <rect width="104" height="20" rx="7" fill="#1e293b" />
      <rect y="12" width="104" height="8" fill="#1e293b" />
      
      <circle cx="11" cy="10" r="2.8" fill="#ef4444" />
      <circle cx="20" cy="10" r="2.8" fill="#f59e0b" />
      <circle cx="29" cy="10" r="2.8" fill="#10b981" />
      
      <!-- Prompt >_ -->
      <path d="M 17 38 L 28 45 L 17 52" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
      <rect x="35" y="37" width="11" height="16" rx="2" fill="#00e676" filter="url(#neonGlow)" />
      <rect x="54" y="43" width="36" height="3" rx="1.5" fill="#38bdf8" opacity="0.7" />
      <rect x="17" y="58" width="50" height="3" rx="1.5" fill="#64748b" opacity="0.6" />
      <rect x="72" y="58" width="22" height="3" rx="1.5" fill="#00e676" opacity="0.7" />
    </g>

    <!-- Node at bottom tip of shield -->
    <circle cx="110" cy="162" r="4" fill="#00f2fe" filter="url(#neonGlow)" />
  </g>

  <!-- Typography & Content (Right of emblem) -->
  <g transform="translate(340, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="186" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#00f2fe" filter="url(#neonGlow)" />
      <text x="26" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DEFENSIVE MCP SERVER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">SecOps MCP</text>

    <!-- Tagline -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.2">
      Defensive Security Tooling &amp; Incident Intelligence for AI Agents
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 145)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#10b981" />
        <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Pure Defensive Analysis</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="158" height="32" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#00f2fe" />
        <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Secret Storing</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(350, 0)">
        <rect width="158" height="32" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#a855f7" />
        <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">HIBP k-Anonymity</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(520, 0)">
        <rect width="150" height="32" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#f59e0b" />
        <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SSRF-Safe Scoring</text>
      </g>
    </g>
  </g>
</svg>
