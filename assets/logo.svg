<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Neon Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.98" />
    </linearGradient>

    <!-- Terminal Window Bar Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Shield Outer Glow -->
  <path d="M 100 22 
           C 142 22, 170 38, 170 82 
           C 170 134, 128 168, 100 182 
           C 72 168, 30 134, 30 82 
           C 30 38, 58 22, 100 22 Z" 
        fill="none" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        filter="url(#neonGlow)" 
        opacity="0.6"/>

  <!-- Shield Base Body -->
  <path d="M 100 24 
           C 140 24, 168 40, 168 82 
           C 168 132, 126 166, 100 180 
           C 74 166, 32 132, 32 82 
           C 32 40, 60 24, 100 24 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Cyber Grid Circuit Lines inside Shield -->
  <path d="M 50 65 L 150 65" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M 100 30 L 100 170" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Embedded Terminal Console Frame -->
  <g transform="translate(52, 60)">
    <!-- Terminal Background -->
    <rect width="96" height="66" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1.5" />
    
    <!-- Terminal Header Bar -->
    <rect width="96" height="18" rx="8" fill="url(#termHeader)" />
    <!-- Flatten bottom corners of header -->
    <rect y="10" width="96" height="8" fill="url(#termHeader)" />
    
    <!-- Terminal Controls -->
    <circle cx="10" cy="9" r="2.5" fill="#ef4444" />
    <circle cx="18" cy="9" r="2.5" fill="#f59e0b" />
    <circle cx="26" cy="9" r="2.5" fill="#10b981" />
    <rect x="70" y="7" width="16" height="4" rx="2" fill="#334155" />

    <!-- Prompt Symbol: >_ -->
    <path d="M 16 33 L 26 40 L 16 47" 
          fill="none" 
          stroke="#00f2fe" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />
          
    <!-- Blinking Cursor Box -->
    <rect x="33" y="32" width="10" height="15" rx="1.5" fill="#00e676" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
    </rect>

    <!-- Code Line Stubs -->
    <rect x="50" y="37" width="32" height="3" rx="1.5" fill="#38bdf8" opacity="0.6" />
    <rect x="16" y="52" width="45" height="3" rx="1.5" fill="#64748b" opacity="0.5" />
    <rect x="65" y="52" width="20" height="3" rx="1.5" fill="#00e676" opacity="0.7" />
  </g>

  <!-- Defensive Pulse Accent Node -->
  <circle cx="100" cy="154" r="4" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="100" cy="154" r="7" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.5" />
</svg>
